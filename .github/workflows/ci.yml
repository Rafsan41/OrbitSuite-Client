name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first — no point finishing a run
# for a commit that has already been superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint and build
    runs-on: ubuntu-latest

    env:
      # The client reads this at build time and falls back to the same value in
      # lib/api-client.ts. Set explicitly so the build is deterministic rather
      # than depending on that default staying put.
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # No API or database is needed: every data-fetching page is a client
      # component, so nothing calls the backend during prerendering.
      - name: Build
        run: npm run build

  # This repository has no test suite. The backend carries the tests, because
  # that is where tenant isolation, webhook idempotency and transactional
  # rollback have to be proven — see the API repository's pipeline.
